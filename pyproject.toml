[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "barrister-ai"
version = "1.0.0"
description = "Modular AI legal precedent retrieval, query classification, and citation validation platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=1.5",
    "scikit-learn>=1.3",
    "joblib>=1.2",
    "sentence-transformers>=2.2",
    "qdrant-client>=1.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "openai>=1.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.scripts]
barrister-ai = "barrister_ai.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
barrister_ai = ["ui/templates/*.html", "citation_validation/db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
